services:
  - type: web
    name: campus-black-box
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 22.5.0
      - key: DEMO_MODE
        value: "true"
      - key: ALLOWED_ORIGIN
        value: https://campus-black-box-delta.vercel.app
      - key: JWT_SECRET
        generateValue: true

